<style>

html, body { height: 100%; font-family: Arial, sans-serif; background: #F5F8F0; }

.header { background: #AAEE44; padding: 10px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #1A3D2B; flex-shrink: 0; }

.cmp-table thead tr { background: #EEF2E8; }
.cmp-table th { padding: 7px 10px; text-align: left; font-size: 10px; color: #1A3D2B; text-transform: uppercase; letter-spacing: 0.3px; }
.cmp-table th:not(:first-child) { text-align: right; }
.cmp-table td { padding: 7px 10px; border-bottom: 1px solid #F0F4EA; }

.quick-actions { padding: 8px 14px 8px; background: white; border-top: 1px solid #E8EEE0; flex-shrink: 0; }
.qa-label { font-size: 10px; color: #8A9A80; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.btn-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.btn-action { background: #F5F8F0; border: 1px solid #C8D4C0; color: #1A3D2B; border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.12s; }

<script>
/* ── Quarter helpers ─────────────────────────────────────────── */
function computeCurrentQtr() {
  const now = new Date();
  return `${now.getFullYear()}-Q${Math.ceil((now.getMonth()+1)/3)}`;
}
function buildQtrOptions(current) {
  const [yr, qPart] = current.split('-Q');
  const y = parseInt(yr, 10), qn = parseInt(qPart, 10);
  const opts = [];
  for (let d = -2; d <= 2; d++) {
    let q = qn + d, y2 = y;
    while (q < 1) { q += 4; y2--; }
    while (q > 4) { q -= 4; y2++; }
    opts.push(`${y2}-Q${q}`);
  }
  return opts;
}
// prior quarter string
function priorQtr(qstr) {
  const yr = parseInt(qstr.slice(0,4), 10);
  const qn = parseInt(qstr.slice(-1), 10);
  return qn === 1 ? `${yr-1}-Q4` : `${yr}-Q${qn-1}`;
}
// same quarter prior year
function priorYearQtr(qstr) {
  return `${parseInt(qstr.slice(0,4),10)-1}-Q${qstr.slice(-1)}`;
}

const CURRENT_QTR = computeCurrentQtr();
document.getElementById('qtr').value = CURRENT_QTR;

const chatEl   = document.getElementById('chat');
const qtrEl    = document.getElementById('qtr');
const statusEl = document.getElementById('status-txt');
let busy = false;
const charts = {};
let activeChipEl = null;

function q()  { return qtrEl.value.trim() || CURRENT_QTR; }
function rq() { return q().replace('-Q', ' Q'); }
function pq() { return priorQtr(q()); }
function pyq(){ return priorYearQtr(q()); }

function setBusy(v) {
  busy = v;
  document.querySelectorAll('.btn-action, #send-btn').forEach(b => b.disabled = v);
  statusEl.textContent = v ? 'Running query…' : 'Ready — pick an analysis or ask a question';
}

function setQtr(val, chipEl) {
  qtrEl.value = val;
  if (activeChipEl) activeChipEl.classList.remove('active');
  if (chipEl) { chipEl.classList.add('active'); activeChipEl = chipEl; }
  addMsg('assistant', `Quarter set to <strong>${val}</strong>. Pick an analysis below or type a question.`);
}

/* ── string extraction from askClaude ───────────────────────── */
function extractString(v) {
  if (!v) return null;
  if (typeof v === 'string') return v.trim() || null;
  if (typeof v === 'object') {
    const s = v.text || v.content || v.message || v.response || v.output;
    if (typeof s === 'string') return s.trim() || null;
    if (Array.isArray(v)) return v.map(x => extractString(x)).filter(Boolean).join(' ') || null;
  }
  return null;
}

/* ── DOM helpers ─────────────────────────────────────────────── */
function addMsg(role, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<div class="msg-label">${role==='assistant'?'CS Analytics':'You'}</div><div class="msg-bubble">${html}</div>`;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d.querySelector('.msg-bubble');
}
function addThinking() {
  const d = document.createElement('div');
  d.className = 'msg assistant';
  d.innerHTML = '<div class="msg-label">CS Analytics</div><div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}
function addStatGrid(bubble, stats) {
  const g = document.createElement('div'); g.className = 'stat-grid';
  stats.forEach(s => {
    if (!s) return;
    const c = document.createElement('div'); c.className = 'stat-card';
    c.innerHTML = `<div class="stat-label">${s.label||''}</div><div class="stat-value">${s.value||'—'}</div>`
      + (s.delta ? `<div class="stat-delta ${s.cls||''}">${s.delta}</div>` : '');
    g.appendChild(c);
  });
  bubble.appendChild(g);
}
function addInsight(bubble, text) {
  const str = typeof text === 'string' ? text.trim() : null;
  if (!str) return;
  const p = document.createElement('div'); p.className = 'insight'; p.textContent = str;
  bubble.appendChild(p);
}
function addChart(bubble, id, labels, datasets, opts) {
  const w = document.createElement('div'); w.className = 'chart-wrap';
  w.innerHTML = `<div class="chart-title">${opts.title||''}</div><div class="chart-canvas-wrap"><canvas id="${id}"></canvas></div>`;
  bubble.appendChild(w);
  chatEl.scrollTop = chatEl.scrollHeight;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const wr = canvas.parentElement;
    if (!wr.offsetWidth) { canvas.style.width='100%'; canvas.style.height='220px'; }
    if (charts[id]) { try { charts[id].destroy(); } catch(e){} }
    charts[id] = new Chart(canvas, {
      type: opts.type || 'bar',
      data: { labels, datasets },
      options: {
        indexAxis: opts.h ? 'y' : 'x',
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 450 },
        plugins: {
          legend: { display: datasets.length > 1, labels: { color:'#1A3D2B', font:{size:11} } },
          tooltip: { callbacks: { label: ctx => opts.pct
            ? (ctx.raw*100).toFixed(1)+'%'
            : '$'+(Math.abs(ctx.raw)/1e6).toFixed(2)+'M' } }
        },
        scales: (() => {
          // value axis gets the number formatter; category axis shows labels as-is
          const numFmt = v => typeof v==='number'
            ? (opts.pct ? (v*100).toFixed(0)+'%' : '$'+(v/1e6).toFixed(1)+'M') : v;
          const valAxis = { grid:{color:'#E8EEE0'}, ticks:{color:'#5F6B5A', font:{size:10}, callback: numFmt} };
          const catAxis = { grid:{color:'#E8EEE0'}, ticks:{color:'#5F6B5A', font:{size:10}} };
          // horizontal bar: x=value, y=category; vertical bar/line: x=category, y=value
          return opts.h ? { x: valAxis, y: catAxis } : { x: catAxis, y: valAxis };
        })()
      }
    });
    chatEl.scrollTop = chatEl.scrollHeight;
  }));
  return id;
}
function addTable(bubble, columns, rows, tableId) {
  const w = document.createElement('div'); w.className = 'table-wrap'; w.id = tableId;
  bubble.appendChild(w);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    new gridjs.Grid({ columns, data: rows, search:true, pagination:{limit:10}, sort:true })
      .render(document.getElementById(tableId));
  }));
}
function addCompareTable(bubble, rows, col1Label, col2Label) {
  const t = document.createElement('table'); t.className = 'cmp-table';
  t.innerHTML = `<thead><tr>
    <th>Metric</th><th>${col1Label}</th><th>${col2Label}</th><th>Delta</th>
  </tr></thead>`;
  const tb = document.createElement('tbody');
  rows.forEach(r => {
    const delta = parseFloat(r.DELTA) || 0;
    const isChurn = (r.METRIC||'').toLowerCase().includes('churn');
    const good = isChurn ? delta < 0 : delta > 0;
    const dColor = delta === 0 ? '#8A9A80' : (good ? '#22C55E' : '#EF4444');
    const arrow  = delta > 0 ? '▲ +' : delta < 0 ? '▼ ' : '→ ';
    let cv = r.CURRENT_VAL, pv = r.PRIOR_VAL, dv;
    if (r.UNIT === '%') {
      cv = parseFloat(cv).toFixed(1)+'%';
      pv = parseFloat(pv).toFixed(1)+'%';
      dv = arrow + Math.abs(parseFloat(r.DELTA)).toFixed(1)+'pp';
    } else if (r.UNIT === '$') {
      cv = fmtArr(cv); pv = fmtArr(pv);
      dv = arrow + fmtArr(Math.abs(parseFloat(r.DELTA)));
    } else {
      cv = fmtNum(cv); pv = fmtNum(pv);
      dv = arrow + Math.abs(parseInt(r.DELTA));
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="font-weight:500;color:#1A3D2B">${r.METRIC}</td>
      <td style="text-align:right;font-weight:600;color:#1A3D2B">${cv}</td>
      <td style="text-align:right;color:#8A9A80">${pv}</td>
      <td style="text-align:right;font-weight:600;color:${dColor}">${dv}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  bubble.appendChild(t);
}
function addExports(bubble, chartId, rawData, fileLabel) {
  const row = document.createElement('div'); row.className = 'export-row';
  if (chartId) {
    const b = document.createElement('button'); b.className = 'btn-export'; b.textContent = '📷 PNG';
    b.onclick = () => { const c = charts[chartId]; if(c){const a=document.createElement('a');a.href=c.toBase64Image();a.download=`cs_${fileLabel}_${q()}.png`;a.click();} };
    row.appendChild(b);
  }
  if (rawData) {
    const b = document.createElement('button'); b.className = 'btn-export'; b.textContent = '📄 CSV';
    b.onclick = () => {
      const keys = Object.keys(rawData[0]||{});
      const csv = [keys.join(','), ...rawData.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      a.download = `cs_${fileLabel}_${q()}.csv`; a.click();
    };
    row.appendChild(b);
  }
  bubble.appendChild(row);
}

/* ── Snowflake ───────────────────────────────────────────────── */
async function runSQL(sql) {
  const r = await window.cowork.callMcpTool('mcp__snowflake__run_snowflake_query', { statement: sql });
  if (r.isError) throw new Error(r.content?.[0]?.text || 'Query failed');
  if (r.structuredContent && Array.isArray(r.structuredContent)) return r.structuredContent;
  const txt = r.content?.[0]?.text || '[]';
  try { const p = JSON.parse(txt); return Array.isArray(p) ? p : [p]; } catch(e) { return []; }
}

/* ── AI insight ──────────────────────────────────────────────── */
async function ai(type, data) {
  try {
    const raw = await window.cowork.askClaude(
      `You are a CS analytics expert for Optimizely. Analyse this ${type} data for quarter ${q()}. Give 2-4 sentences of direct business insight: highlight key metrics, standout trends, and what the CS chief should focus on next. Be specific and concise — no preamble.`,
      Array.isArray(data) ? data.slice(0,20) : [data]
    );
    return extractString(raw);
  } catch(e) { return null; }
}

/* ── Formatters ──────────────────────────────────────────────── */
function fmtPct(v) { if(v==null)return'—'; return (parseFloat(v)*100).toFixed(1)+'%'; }
function fmtArr(v) { if(v==null)return'—'; const n=parseFloat(v); if(isNaN(n))return'—'; const abs=Math.abs(n); return (n<0?'-':'')+'$'+(abs>=1e6?(abs/1e6).toFixed(1)+'M':abs>=1e3?(abs/1e3).toFixed(0)+'K':abs.toFixed(0)); }
function fmtNum(v) { if(v==null)return'—'; return parseFloat(v).toLocaleString(); }
function pp(v)     { if(v==null)return null; const n=parseFloat(v); return (n>=0?'▲ +':'▼ ')+(Math.abs(n)*100).toFixed(1)+'pp'; }
function ppCls(v)  { if(v==null)return''; return parseFloat(v)>=0?'up':'dn'; }

/* helper: prior quarter string for SST queries */
function pqStr() {
  const qn = parseInt(q().slice(-1), 10);
  const yr = parseInt(q().slice(0,4), 10);
  return qn===1 ? `${yr-1}-Q4` : `${yr}-Q${qn-1}`;
}

/* ── SQL builders ────────────────────────────────────────────── */
const SQL = {

  scorecard: () => `
WITH qp AS (SELECT '${q()}' AS tq, CAST(LEFT('${q()}',4) AS INT) AS yr, CAST(RIGHT('${q()}',1) AS INT) AS qn),
ql AS (SELECT tq, CASE WHEN qn=1 THEN (yr-1)||'-Q4' ELSE yr||'-Q'||(qn-1) END AS pq FROM qp),
base AS (
  SELECT DATE_YQ,
    COUNT(DISTINCT CASE WHEN ARR_RENEWAL>0 THEN MASTER_CUSTOMER_ID END) AS rc,
    SUM(ARR_RENEWAL) AS ra, SUM(ARR_CHURN) AS ca,
    COUNT(DISTINCT CASE WHEN ARR_CHURN<0 THEN MASTER_CUSTOMER_ID END) AS cc,
    DIV0(SUM(ARR_RENEWAL)+SUM(ARR_CHURN),SUM(ARR_RENEWAL)) AS rr
  FROM REPORTING.GTM_ANALYTICS.EXEC_DECK_RENEWAL_RATES_CUSTOMER GROUP BY DATE_YQ
)
SELECT c.DATE_YQ AS CQ, p.DATE_YQ AS PQ,
  c.rc AS CRC, p.rc AS PRC, c.cc AS CCC, p.cc AS PCC,
  ROUND(c.ra,0) AS CRA, ROUND(p.ra,0) AS PRA,
  ROUND(c.ca,0) AS CCA, ROUND(p.ca,0) AS PCA,
  ROUND(c.rr,4) AS CRR, ROUND(p.rr,4) AS PRR, ROUND(c.rr-p.rr,4) AS DELTA
FROM base c CROSS JOIN base p JOIN ql l ON c.DATE_YQ=l.tq AND p.DATE_YQ=l.pq`,

  /* QoQ/YoY — single wide row (no UNION; MCP blocks UNION statements) */
  qoq: () => `
WITH base AS (
  SELECT DATE_YQ,
    COUNT(DISTINCT CASE WHEN ARR_RENEWAL>0 THEN MASTER_CUSTOMER_ID END) AS RC,
    ROUND(SUM(ARR_RENEWAL),0) AS RENEWAL_ARR,
    ROUND(SUM(ARR_CHURN),0) AS CHURN_ARR,
    COUNT(DISTINCT CASE WHEN ARR_CHURN<0 THEN MASTER_CUSTOMER_ID END) AS CC,
    ROUND(DIV0(SUM(ARR_RENEWAL)+SUM(ARR_CHURN),SUM(ARR_RENEWAL)),4) AS RENEWAL_RATE
  FROM REPORTING.GTM_ANALYTICS.EXEC_DECK_RENEWAL_RATES_CUSTOMER
  WHERE DATE_YQ IN ('${q()}','${pqStr()}')
  GROUP BY DATE_YQ
),
piv AS (
  SELECT
    MAX(CASE WHEN DATE_YQ='${q()}' THEN RENEWAL_RATE END) AS C_RR,
    MAX(CASE WHEN DATE_YQ='${pqStr()}' THEN RENEWAL_RATE END) AS P_RR,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN RENEWAL_ARR  END) AS C_RA,
    MAX(CASE WHEN DATE_YQ='${pqStr()}' THEN RENEWAL_ARR  END) AS P_RA,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN CHURN_ARR    END) AS C_CA,
    MAX(CASE WHEN DATE_YQ='${pqStr()}' THEN CHURN_ARR    END) AS P_CA,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN RC            END) AS C_RC,
    MAX(CASE WHEN DATE_YQ='${pqStr()}' THEN RC            END) AS P_RC,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN CC            END) AS C_CC,
    MAX(CASE WHEN DATE_YQ='${pqStr()}' THEN CC            END) AS P_CC
  FROM base
)
SELECT
  ROUND(C_RR*100,2)    AS RR_CUR, ROUND(P_RR*100,2)    AS RR_PRI, ROUND((C_RR-P_RR)*100,2)    AS RR_DLT,
  C_RA                 AS RA_CUR, P_RA                 AS RA_PRI, C_RA-P_RA                    AS RA_DLT,
  C_CA                 AS CA_CUR, P_CA                 AS CA_PRI, C_CA-P_CA                    AS CA_DLT,
  C_RC                 AS RC_CUR, P_RC                 AS RC_PRI, C_RC-P_RC                    AS RC_DLT,
  C_CC                 AS CC_CUR, P_CC                 AS CC_PRI, C_CC-P_CC                    AS CC_DLT
FROM piv`,

  yoy: () => `
WITH base AS (
  SELECT DATE_YQ,
    COUNT(DISTINCT CASE WHEN ARR_RENEWAL>0 THEN MASTER_CUSTOMER_ID END) AS RC,
    ROUND(SUM(ARR_RENEWAL),0) AS RENEWAL_ARR,
    ROUND(SUM(ARR_CHURN),0) AS CHURN_ARR,
    COUNT(DISTINCT CASE WHEN ARR_CHURN<0 THEN MASTER_CUSTOMER_ID END) AS CC,
    ROUND(DIV0(SUM(ARR_RENEWAL)+SUM(ARR_CHURN),SUM(ARR_RENEWAL)),4) AS RENEWAL_RATE
  FROM REPORTING.GTM_ANALYTICS.EXEC_DECK_RENEWAL_RATES_CUSTOMER
  WHERE DATE_YQ IN ('${q()}','${pyq()}')
  GROUP BY DATE_YQ
),
piv AS (
  SELECT
    MAX(CASE WHEN DATE_YQ='${q()}' THEN RENEWAL_RATE END) AS C_RR,
    MAX(CASE WHEN DATE_YQ='${pyq()}' THEN RENEWAL_RATE END) AS P_RR,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN RENEWAL_ARR  END) AS C_RA,
    MAX(CASE WHEN DATE_YQ='${pyq()}' THEN RENEWAL_ARR  END) AS P_RA,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN CHURN_ARR    END) AS C_CA,
    MAX(CASE WHEN DATE_YQ='${pyq()}' THEN CHURN_ARR    END) AS P_CA,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN RC            END) AS C_RC,
    MAX(CASE WHEN DATE_YQ='${pyq()}' THEN RC            END) AS P_RC,
    MAX(CASE WHEN DATE_YQ='${q()}' THEN CC            END) AS C_CC,
    MAX(CASE WHEN DATE_YQ='${pyq()}' THEN CC            END) AS P_CC
  FROM base
)
SELECT
  ROUND(C_RR*100,2)    AS RR_CUR, ROUND(P_RR*100,2)    AS RR_PRI, ROUND((C_RR-P_RR)*100,2)    AS RR_DLT,
  C_RA                 AS RA_CUR, P_RA                 AS RA_PRI, C_RA-P_RA                    AS RA_DLT,
  C_CA                 AS CA_CUR, P_CA                 AS CA_PRI, C_CA-P_CA                    AS CA_DLT,
  C_RC                 AS RC_CUR, P_RC                 AS RC_PRI, C_RC-P_RC                    AS RC_DLT,
  C_CC                 AS CC_CUR, P_CC                 AS CC_PRI, C_CC-P_CC                    AS CC_DLT
FROM piv`
};

      { label:'Churn ARR',         value: fmtArr(d.CA_CUR) },
      { label:'Renewing accounts', value: fmtNum(d.RC_CUR) },
      { label:'Churned accounts',  value: fmtNum(d.CC_CUR) },
    ];
    const insight = await ai('year-over-year KPI comparison', metrics);
    const b = addMsg('assistant','');
    addStatGrid(b, stats);
    addInsight(b, insight);
    addCompareTable(b, metrics, q(), pyq());
    addExports(b, null, metrics, 'yoy');
  }
};

/* ── Entry points ────────────────────────────────────────────── */
const LABELS = {
  scorecard:'Scorecard', by_region:'By region', by_product_group:'By product group',
  by_product_solution:'By product solution', by_quarter:'By quarter',
  opal_attach:'Opal attach', opal_pipeline:'Opal pipeline', oa_pipeline:'OA pipeline',
  csms_portfolio:'CSMs portfolio', by_rev_segment:'By revenue segment',
  by_arr_band:'By ARR band', by_territory:'By territory',
  single_multi:'Single or multi-solution', churn_codes:'Churn codes',
  cross_upsell:'Cross-/upsell', product_swaps:'Product swaps',
  eo_deep_dive:'EO Deep Dive', top_churn:'Top churned accounts',
  qoq:'QoQ comparison', yoy:'YoY comparison'
};

async function go(type) {
  if (busy) return;
  addMsg('user', `${LABELS[type]} — ${q()}`);
  const t = addThinking();
  setBusy(true);
  try {
    await handlers[type]();
  } catch(e) {
    const b = addMsg('assistant','');
    const err = document.createElement('div'); err.className = 'error-box';
    err.textContent = 'Error: ' + e.message; b.appendChild(err);
  } finally {
    t.remove(); setBusy(false);
  }
}

async function send() {
  if (busy) return;
  const inp = document.getElementById('chat-in');
  const txt = inp.value.trim(); if (!txt) return;
  inp.value = '';
  const t = txt.toLowerCase();
  let action = null;
  if      (t.includes('scorecard')||t.includes('renewal rate')||t.includes('overall')) action='scorecard';
  else if (t.includes('by quarter')||t.includes('trend')||t.includes('over time'))    action='by_quarter';
  else if (t.includes('qoq')||t.includes('quarter over quarter')||t.includes('q-o-q')) action='qoq';
  else if (t.includes('yoy')||t.includes('year over year')||t.includes('y-o-y'))       action='yoy';
  else if (t.includes('eo deep')||t.includes('experimentation deep'))                  action='eo_deep_dive';
  else if (t.includes('product swap'))                                                  action='product_swaps';
  else if (t.includes('cross') || t.includes('upsell'))                               action='cross_upsell';
  else if (t.includes('churn code')||t.includes('churn reason')||t.includes('why churn')) action='churn_codes';
  else if (t.includes('top churn')||t.includes('churned account'))                     action='top_churn';
  else if (t.includes('opal attach')||t.includes('attach rate'))                       action='opal_attach';
  else if (t.includes('opal pipeline')||t.includes('opal deal'))                       action='opal_pipeline';
  else if (t.includes(' oa ')||t.includes('oa pipeline')||t.includes('optimizely analytics')) action='oa_pipeline';
  else if (t.includes('opal'))                                                          action='opal_attach';
  else if (t.includes('csm')||t.includes('csms'))                                      action='csms_portfolio';
  else if (t.includes('arr band')||t.includes('arr size'))                             action='by_arr_band';
  else if (t.includes('territory'))                                                     action='by_territory';
  else if (t.includes('segment')||t.includes('sfdc'))                                  action='by_rev_segment';
  else if (t.includes('single')||t.includes('multi-solution')||t.includes('multi solution')) action='single_multi';
  else if (t.includes('product solution'))                                              action='by_product_solution';
  else if (t.includes('product group'))                                                 action='by_product_group';
  else if (t.includes('product')||t.includes('solution'))                              action='by_product_group';
  else if (t.includes('region'))                                                        action='by_region';
  else if (t.includes('eo ')||t.includes('experimentation'))                           action='eo_deep_dive';
  if (action) { await go(action); return; }
  addMsg('user', txt);
  const th = addThinking(); setBusy(true);
  try {
    const rawReply = await window.cowork.askClaude(
      `You are a CS analytics assistant. Answer this question about Optimizely CS metrics (quarter ${q()}): "${txt}". Suggest the most relevant quick-action button: Scorecard, By region, By product group, By product solution, By quarter, Opal attach, Opal pipeline, OA pipeline, CSMs portfolio, By revenue segment, By ARR band, By territory, Single or multi-solution, Churn codes, Cross-/upsell, Product swaps, EO Deep Dive, Top churned accounts, QoQ comparison, YoY comparison. Keep it concise.`, []
    );
    const reply = extractString(rawReply);
    th.remove();
    addMsg('assistant', reply || 'Use one of the quick analysis buttons above to pull live data.');
  } catch(e) {
    th.remove();
    addMsg('assistant','Use one of the quick analysis buttons above to pull live data from Snowflake.');
  } finally { setBusy(false); }
}

/* ── Welcome ─────────────────────────────────────────────────── */
(function showWelcome() {
  const opts = buildQtrOptions(CURRENT_QTR);
  const b = addMsg('assistant', 'Hi! Live Snowflake access ready. Which quarter would you like to analyse?');
  const chipsDiv = document.createElement('div'); chipsDiv.className = 'qtr-chips';
  opts.forEach(val => {
    const chip = document.createElement('button'); chip.className = 'chip' + (val===CURRENT_QTR?' active':'');
    chip.textContent = val + (val===CURRENT_QTR?' ✦ current':'');
    chip.onclick = () => setQtr(val, chip); chipsDiv.appendChild(chip);
    if (val===CURRENT_QTR) activeChipEl = chip;
  });
  b.appendChild(chipsDiv);
  const note = document.createElement('p'); note.style.cssText='font-size:11px;color:#8A9A80;margin-top:7px;';
  note.textContent = 'Or type a custom quarter in the field above. Then pick any of the 20 analyses below.';
  b.appendChild(note);
})();
